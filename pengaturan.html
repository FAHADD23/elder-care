    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 flex flex-col h-screen overflow-y-auto">
        
        <!-- Header Atas -->
        <header class="bg-surface border-b border-borderLight px-8 py-4 flex justify-between items-center sticky top-0 z-30">
            <div>
                <h1 class="text-xl font-bold text-textPrimary">Pengaturan Sistem</h1>
                <p class="text-xs text-textSecondary">Kelola profil lansia, perangkat ESP32, dan bot notifikasi</p>
            </div>
        </header>

        <!-- Konten Pengaturan -->
        <main class="p-8 max-w-4xl space-y-6 pb-12">

            <!-- Notifikasi Berhasil Simpan -->
            <div id="alert-success" class="hidden p-4 bg-emerald-50 border border-emerald-200 text-success text-sm rounded-xl font-medium flex items-center gap-2">
                ✓ Pengaturan berhasil disimpan ke sistem!
            </div>

            <!-- Form Pengaturan -->
            <form id="settings-form" class="space-y-6">
                
                <!-- Card 1: Profil Lansia -->
                <div class="bg-surface p-6 rounded-2xl border border-borderLight shadow-sm space-y-4">
                    <h2 class="text-base font-bold text-textPrimary pb-2 border-b border-gray-100">Informasi Lansia & Pemantauan</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-textSecondary mb-1.5 uppercase">Nama Lengkap Lansia</label>
                            <input type="text" id="elder-name" value="Ny. Siti Aminah" class="w-full px-4 py-2.5 rounded-lg border border-borderLight text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-textSecondary mb-1.5 uppercase">ID Perangkat Gelang (#ID)</label>
                            <input type="text" id="device-id" value="#ELDER-ESP32-01" class="w-full px-4 py-2.5 rounded-lg border border-borderLight text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                        </div>
                    </div>
                </div>

                <!-- Card 2: Kontak Darurat -->
                <div class="bg-surface p-6 rounded-2xl border border-borderLight shadow-sm space-y-4">
                    <h2 class="text-base font-bold text-textPrimary pb-2 border-b border-gray-100">Kontak Darurat Keluarga</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-textSecondary mb-1.5 uppercase">Nama Penanggung Jawab</label>
                            <input type="text" id="contact-name" value="Bpk. Budi" class="w-full px-4 py-2.5 rounded-lg border border-borderLight text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-textSecondary mb-1.5 uppercase">Nomor WhatsApp / Telepon</label>
                            <input type="text" id="contact-phone" value="+62 812-3456-7890" class="w-full px-4 py-2.5 rounded-lg border border-borderLight text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                        </div>
                    </div>
                </div>

                <!-- Card 3: Integrasi IoT & Bot Telegram -->
                <div class="bg-surface p-6 rounded-2xl border border-borderLight shadow-sm space-y-4">
                    <h2 class="text-base font-bold text-textPrimary pb-2 border-b border-gray-100">Konfigurasi ESP32 & Bot Telegram</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-textSecondary mb-1.5 uppercase">Telegram Bot Token</label>
                            <input type="text" id="telegram-token" value="7382910:AAHxxxx_ElderCareBotTokenExample" class="w-full px-4 py-2.5 rounded-lg border border-borderLight text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary font-mono text-xs">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-textSecondary mb-1.5 uppercase">Telegram Chat ID Penerima Peringatan</label>
                            <input type="text" id="telegram-chatid" value="192837465" class="w-full px-4 py-2.5 rounded-lg border border-borderLight text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary font-mono text-xs">
                        </div>
                    </div>
                </div>

                <!-- Tombol Simpan -->
                <div class="flex justify-end gap-4">
                    <button type="submit" class="px-6 py-3 bg-primary hover:bg-secondary text-white font-medium text-sm rounded-xl transition-colors shadow-sm">
                        Simpan Perubahan
                    </button>
                </div>

            </form>

        </main>
    </div>

    <!-- Script Interaksi & Logout -->
   <!-- Script Interaksi, Penyimpanan Lokal, & Logout -->
    <script>
        const settingsForm = document.getElementById('settings-form');
        const alertSuccess = document.getElementById('alert-success');

        // Fungsi saat halaman Pengaturan dimuat, tampilkan data yang sudah tersimpan sebelumnya
        window.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('elderName')) document.getElementById('elder-name').value = localStorage.getItem('elderName');
            if(localStorage.getItem('deviceId')) document.getElementById('device-id').value = localStorage.getItem('deviceId');
            if(localStorage.getItem('contactName')) document.getElementById('contact-name').value = localStorage.getItem('contactName');
            if(localStorage.getItem('contactPhone')) document.getElementById('contact-phone').value = localStorage.getItem('contactPhone');
            if(localStorage.getItem('telegramToken')) document.getElementById('telegram-token').value = localStorage.getItem('telegramToken');
            if(localStorage.getItem('telegramChatId')) document.getElementById('telegram-chatid').value = localStorage.getItem('telegramChatId');
        });

        settingsForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Simpan semua isian form ke localStorage browser
            localStorage.setItem('elderName', document.getElementById('elder-name').value);
            localStorage.setItem('deviceId', document.getElementById('device-id').value);
            localStorage.setItem('contactName', document.getElementById('contact-name').value);
            localStorage.setItem('contactPhone', document.getElementById('contact-phone').value);
            localStorage.setItem('telegramToken', document.getElementById('telegram-token').value);
            localStorage.setItem('telegramChatId', document.getElementById('telegram-chatid').value);
            
            // Tampilkan pesan sukses sebentar
            alertSuccess.classList.remove('hidden');
            
            // Hilangkan pesan setelah 3 detik
            setTimeout(() => {
                alertSuccess.classList.add('hidden');
            }, 3000);
        });

        function prosesLogout() {
            sessionStorage.removeItem("isLoggedIn");
            window.location.replace("login.html");
        }
    </script>
</body>
</html>
