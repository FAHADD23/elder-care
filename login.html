<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElderCare - Login</title>
    
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Konfigurasi Warna & Font sesuai Design System -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#247C83',
                        secondary: '#258568',
                        accent: '#2ECC71',
                        bglight: '#F7F9FA',
                        surface: '#FFFFFF',
                        textPrimary: '#233747',
                        textSecondary: '#71818D',
                        borderLight: '#E5E7EB',
                        error: '#EF4444'
                    },
                    fontFamily: {
                        sans: ['"Poppins"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bglight text-textPrimary font-sans h-screen flex items-center justify-center p-4">

    <!-- Container Utama Login (Grid 2 Kolom) -->
    <div class="bg-surface w-full max-w-[900px] rounded-[24px] shadow-sm border border-gray-100 flex flex-col md:flex-row overflow-hidden h-[550px]">
        
        <!-- Kolom Kiri: Branding & Info -->
        <div class="hidden md:flex flex-col w-1/2 bg-primary/5 p-10 relative overflow-hidden justify-between">
            <div>
                <!-- Logo -->
                <div class="flex items-center gap-3 text-primary font-bold text-2xl mb-6">
                    <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                    <span>ElderCare</span>
                </div>
                
                <h1 class="text-2xl font-bold text-textPrimary mb-2">Lebih dekat, lebih aman</h1>
                <p class="text-textSecondary text-sm leading-relaxed max-w-[280px]">
                    Sistem pemantauan lansia jarak jauh berbasis ESP32 dan IoT.
                </p>
            </div>

            <!-- Ilustrasi Dekorasi -->
            <div class="absolute -bottom-10 -left-10 text-primary/10">
                <svg class="w-64 h-64" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
        </div>

        <!-- Kolom Kanan: Form Login -->
        <div class="w-full md:w-1/2 p-10 flex flex-col justify-center bg-surface relative z-10">
            <div class="mb-6">
                <h2 class="text-[24px] font-bold text-textPrimary mb-1">Masuk ke Akun</h2>
                <p class="text-textSecondary text-sm">Silakan login untuk melanjutkan</p>
            </div>

            <!-- Pesan Error / Alert -->
            <div id="error-message" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-error text-xs rounded-lg flex items-center gap-2">
                <span id="error-text">Email atau password salah.</span>
            </div>

            <form id="login-form" class="space-y-4">
                <!-- Input Email -->
                <div class="space-y-1.5">
                    <label for="email" class="block text-sm font-medium text-textPrimary">Email</label>
                    <input type="email" id="email" required placeholder="cth: keluarga@email.com" 
                        class="w-full px-4 py-3 rounded-lg border border-borderLight focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-sm placeholder:text-gray-400">
                </div>

                <!-- Input Password -->
                <div class="space-y-1.5">
                    <label for="password" class="block text-sm font-medium text-textPrimary">Password</label>
                    <div class="relative">
                        <input type="password" id="password" required placeholder="Masukkan password" 
                            class="w-full px-4 py-3 rounded-lg border border-borderLight focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-sm placeholder:text-gray-400">
                        <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-textPrimary text-xs font-semibold">
                            Lihat
                        </button>
                    </div>
                </div>

                <!-- Tombol Login -->
                <div class="pt-2">
                    <button type="submit" id="btn-login"
                        class="w-full bg-primary hover:bg-secondary text-white font-medium py-3 rounded-lg transition-colors duration-200 flex justify-center items-center gap-2">
                        <span>Login</span>
                    </button>
                </div>
            </form>

            <!-- Lupa Password -->
            <div class="mt-6 text-center">
                <a href="#" class="text-primary text-sm font-medium hover:underline">
                    Lupa password?
                </a>
            </div>
        </div>

    </div>

    <!-- SCRIPT GOOGLE SHEETS LOGIN & SESSION -->
    <script>
        const SPREADSHEET_API_URL = "https://script.google.com/macros/s/AKfycbzobFeWPjUFD6flFPNdIduppW-uhbwI4pYDDrWePG882c8UEIo_fwXH4A3FiAJmP_Z-wg/exec";

        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const btnLogin = document.getElementById('btn-login');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            errorMessage.classList.add('hidden');
            btnLogin.disabled = true;
            btnLogin.innerHTML = `<span class="animate-spin border-2 border-white border-t-transparent rounded-full w-4 h-4"></span> Memeriksa Database...`;

            try {
                // Mengirim request otentikasi ke Google Apps Script Web App
                const response = await fetch(`${SPREADSHEET_API_URL}?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`);
                const data = await response.json();

                if (data.status === "success") {
                    // Simpan sesi login aktif
                    sessionStorage.setItem("isLoggedIn", "true");
                    
                    // Alihkan ke dashboard utama & timpa history browser
                    window.location.replace("index.html");
                } else {
                    errorMessage.classList.remove('hidden');
                    errorText.innerText = data.message || "Email atau password salah!";
                    btnLogin.disabled = false;
                    btnLogin.innerHTML = `<span>Login</span>`;
                }
            } catch (err) {
                errorMessage.classList.remove('hidden');
                errorText.innerText = "Gagal terhubung ke database Google Sheets.";
                btnLogin.disabled = false;
                btnLogin.innerHTML = `<span>Login</span>`;
            }
        });

        // Fitur Toggle Lihat Password
        const togglePassword = document.getElementById('toggle-password');
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.innerText = type === 'password' ? 'Lihat' : 'Sembunyikan';
        });
    </script>
</body>
</html>
